name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4deb48c443f8b44b44b44b44b44b44b44b44
      - name: Dependency Review
        uses: actions/dependency-review-action@487804ac38b38b38b38b38b38b38b38b38b38b38
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-2, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0, MPL-2.0, EUPL-1.2, CCPL-1.0
