name: CI
on:
  pull_request: null
  push:
    branches:
    - main
jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npx tsc --noEmit
    - name: Run tests
      run: npm test
    timeout-minutes: 15
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
