name: CI
on:
  pull_request: null
  push:
    branches:
    - main
jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npx tsc --noEmit
    - name: Run tests
      run: npm test
    timeout-minutes: 15
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rotula_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rotula_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rotula_test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Generate Prisma client
      run: npx prisma generate
    - name: Apply database migrations
      run: npx prisma migrate deploy
    - name: Run webhook integration tests
      run: npm test -- src/__tests__/webhook.integration.test.ts
      continue-on-error: false
    - name: Run unit tests
      run: npx jest --testPathIgnorePatterns integration
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
